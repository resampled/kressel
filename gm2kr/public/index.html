<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- Where "Play" opens krplayer. The dev player runs on :8000 (pnpm dev:player); the site sets its own. -->
  <meta name="gm2kr-player-url" content="http://localhost:8000/" />
  <title>gm2kr</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 40px auto; padding: 0 16px; }
    .actions { margin: 12px 0; display: flex; gap: 8px; }
    .status { min-height: 1.5em; display: flex; align-items: center; gap: 8px; }
  </style>
</head>
<body>
  <h1>GameMaker → Kratience</h1>
  <p>Select your GameMaker game folder (must include <code>data.win</code> and referenced assets).</p>
  <input id="input" type="file" webkitdirectory multiple />
  <p>
    <label><input id="ogg" type="checkbox" /> Compress <code>.ogg</code> audio (re-encodes as Opus, lossy)</label>
    <label>at <input id="kbps" type="number" min="16" max="256" step="8" value="64" /> kbps</label>
  </p>
  <div class="actions">
    <button id="download" disabled>Download .krpj</button>
    <button id="play" disabled>Play in krplayer</button>
  </div>
  <p class="status"><progress id="bar" hidden></progress> <span id="status"></span></p>
  <pre id="log"></pre>
  <script src="./gm2kr.js"></script>
</body>
</html>
