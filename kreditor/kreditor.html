<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>kreditor</title>
<link rel="stylesheet" href="_static/kreditor.css">
</head>
<body>
<div class="nav1">
    <div class="n1-lft">
    <a class="n1-krlogo">KRATIENCE</a>
    <div class="n1-lftbtn">[File]</div>
    <div class="n1-lftbtn">Undo</div>
    <div class="n1-lftbtn">Redo</div>
    <div class="n1-lftbtn">[PlayOptions]</div>
    <div class="n1-lftbtn n1-play">PLAY!</div>
    </div>
    <div class="n1-rgt">
        <div class="n1-complexity">
            0.00/100MB
        </div>
    </div>
</div>
<div class="nav2">
    <div class="n2-search">
        <input type="text" placeholder="Find asset">
    </div>
    <div class="n2-drop">Game</div>
    <div class="n2-drop">Functions</div>
    <div class="n2-drop">Rooms</div>
    <div class="n2-drop">Objects</div>
    <div class="n2-drop">Sprites</div>
    <div class="n2-drop">Audio</div>
    <div class="n2-drop">Fonts</div>
    <div class="n2-drop">Tilesets</div>
</div>
<div class="desk">
<div class="w max">
    <div class="wtop">
        <span class="wtitle">Code</span>
        <img class="wbtn" src="_static/expand.png" data-act="max" title="Expand" alt="Expand" draggable="false">
        <img class="wbtn" src="_static/exit.png" data-act="close" title="Close" alt="Close" draggable="false">
    </div>
    <div class="w-code">
        <div class="w-code-list">
        </div>
        <div class="w-code-box">
        </div>
    </div>
</div>
</div>
<script src="_static/windows.js"></script>
<script src="_static/opcodes.gen.js"></script>
<script src="_static/codeblocks.js"></script>
</body>
</html>
