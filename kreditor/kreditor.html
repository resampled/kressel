<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="kreditor-eval" content="../krplayer/dist/kressel_eval.js">
    <title>kreditor</title>
<link rel="stylesheet" href="_static/kreditor.css">
</head>
<body>
<div class="nav1">
    <div class="n1-lft">
    <a class="n1-krlogo">KRATIENCE</a>
    <div class="n1-lftbtn" data-menu="file">[File]</div>
    <div class="n1-lftbtn off" data-act="undo" title="Undo (Ctrl+Z)">Undo</div>
    <div class="n1-lftbtn off" data-act="redo" title="Redo (Ctrl+Y)">Redo</div>
    <div class="n1-lftbtn">[PlayOptions]</div>
    <div class="n1-lftbtn n1-play">PLAY!</div>
    </div>
    <div class="n1-rgt">
        <div class="n1-complexity">
            0.00/100MB
        </div>
    </div>
</div>
<div class="nav2">
    <div class="n2-search">
        <input type="text" placeholder="Find...">
    </div>
    <div class="n2-drop" data-menu="game">Game</div>
    <div class="n2-drop" data-menu="functions">Functions</div>
    <div class="n2-drop" data-menu="rooms">Rooms</div>
    <div class="n2-drop" data-menu="objects">Objects</div>
    <div class="n2-drop" data-menu="sprites">Sprites</div>
    <div class="n2-drop" data-menu="sounds">Audio</div>
    <div class="n2-drop" data-menu="fonts">Fonts</div>
    <div class="n2-drop" data-menu="tilesets">Tilesets</div>
</div>
<div class="desk">
<div class="w max">
    <div class="wtop">
        <span class="wtitle">Code</span>
        <span class="wtabs" hidden></span>
        <img class="wbtn" src="_static/expand.png" data-act="max" title="Expand" alt="Expand" draggable="false">
        <img class="wbtn" src="_static/exit.png" data-act="close" title="Close" alt="Close" draggable="false">
    </div>
    <div class="w-code">
        <div class="w-code-list">
        </div>
        <div class="w-code-box">
        </div>
    </div>
    <div class="w-props" hidden></div>
</div>
</div>
<script src="_static/windows.js"></script>
<script src="_static/opcodes.gen.js"></script>
<script src="_static/codeblocks.js"></script>
<script src="_static/krpj.js"></script>
<script src="_static/project.js"></script>
<script src="_static/views.js"></script>
</body>
</html>
