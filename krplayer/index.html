<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <!-- Set src to a game.json or .krpj URL to autoload it. Left empty in dev: the player then
       accepts a project from gm2kr ("Play in krplayer") or a dropped .krpj. -->
  <meta id="kressel-load-project" src="" />
  <title>krplayer dev</title>
  <style>
    html, body { margin: 0 auto; background: #000; display: flex; }
    /* kressel.js needs .kr-root containing a <canvas> and a .kr-msg; the canvas is scaled to fit .kr-root. */
    .kr-root { position: relative; height: min(100vh, 75vw); aspect-ratio: 4 / 3; margin: 0 auto; display: flex; align-items: center; justify-content: center; background: #000; color: #ddd; font: 14px system-ui, sans-serif; }
    .kr-root canvas { display: block; image-rendering: pixelated; }
    .kr-msg { position: absolute; max-width: 640px; padding: 16px; text-align: center; white-space: pre-wrap; }
    .kr-err { color: red; text-align: left; font-family: monospace; background: black; }
    .kr-drop { border: 2px dashed #555; border-radius: 8px; padding: 32px; }
    .kr-info{ width: 100%; color: white; padding: 1em;}
  </style>
</head>
<body>
  <div class="kr-info kr-info-lft">left</div>
  <div class="kr-root">
    <canvas></canvas>
    <div class="kr-msg" hidden></div>
  </div>
  <div class="kr-info kr-info-rgt">right</div>
  <script src="./dist/kressel.js"></script>
</body>
</html>
